services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      ECOTWIN_OPENAI_API_KEY: ${ECOTWIN_OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_MODE: ${STRIPE_MODE:-test}
      STRIPE_ALLOW_LIVE: ${STRIPE_ALLOW_LIVE:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      API_KEY: ${API_KEY:-}
      INFLUX_URL: ${INFLUX_URL:-http://influxdb:8086}
      INFLUX_TOKEN: ${INFLUX_INIT_ADMIN_TOKEN:-}
      INFLUX_ORG: ${INFLUX_INIT_ORG:-EcoTwin}
      INFLUX_BUCKET: ${INFLUX_INIT_BUCKET:-air_quality}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes:
      - app-data:/app/.runtime
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    depends_on: [api]
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    restart: unless-stopped

  influxdb:
    profiles: [telemetry]
    image: influxdb:2.7
    ports: ["127.0.0.1:${INFLUX_PORT:-8086}:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_INIT_USERNAME:-ecotwin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_INIT_PASSWORD:-}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_INIT_ORG:-EcoTwin}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_INIT_BUCKET:-air_quality}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_INIT_ADMIN_TOKEN:-}
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
    restart: unless-stopped

  grafana:
    profiles: [monitoring]
    image: grafana/grafana-oss:11.1.0
    ports: ["127.0.0.1:${GRAFANA_PORT:-3005}:3000"]
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      INFLUX_INIT_ORG: ${INFLUX_INIT_ORG:-EcoTwin}
      INFLUX_INIT_BUCKET: ${INFLUX_INIT_BUCKET:-air_quality}
      INFLUX_INIT_ADMIN_TOKEN: ${INFLUX_INIT_ADMIN_TOKEN:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  app-data:
  influx-data:
  influx-config:
  grafana-data:
